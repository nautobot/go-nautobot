---
name: "CI"
on: # yamllint disable-line rule:truthy rule:comments
  push:
    branches:
      - "main"
      - "develop"
    tags:
      - "v*"
  pull_request: ~
concurrency: # Cancel any existing runs of this workflow for this same PR
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: "Get go-nautobot code"
        uses: actions/checkout@v4
      - name: "Regenerate bindings and run tests"
        run: |
          cd development
          make ci
      - name: "Check that generated code matches the committed tree"
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            echo "::error::Generated code differs from what is committed. Run 'cd development && make' locally and commit the result."
            git diff --cached --stat
            exit 1
          fi
